<text x="290" y="86" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">vLLM OpenAI 服务 + 调度器</text>
<text x="290" y="112" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• 最多同时运行 8 条序列（--max-num-seqs 8），更多请求在队列里等待</text>
<text x="290" y="134" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• prefill 按 16K token 分块 · DSpark 投机解码 k=5（每步约 4 个 token）</text>
<text x="290" y="156" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• KV cache 池：fp8，共约 107 万 token，所有运行中的请求共用</text>
