<text x="480.0" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">DeepSeek-V4.1-Flash-1017 在 2× RTX PRO 6000 上的部署结构</text>
<rect x="30" y="60" width="190" height="110" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
