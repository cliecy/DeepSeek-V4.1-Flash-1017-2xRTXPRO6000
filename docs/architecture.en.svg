<svg xmlns="http://www.w3.org/2000/svg" width="960" height="808" viewBox="0 0 960 808" font-family="Helvetica, Arial, &apos;DejaVu Sans&apos;, &apos;Liberation Sans&apos;, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="0" y="0" width="960" height="808" fill="#ffffff"/>
<text x="480.0" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">DeepSeek-V4.1-Flash-1017 on 2× RTX PRO 6000: serving architecture</text>
<rect x="30" y="60" width="190" height="110" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
<text x="125" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Clients</text>
<text x="125" y="122" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555">OpenAI-compatible API</text>
<text x="125" y="142" font-size="12" font-weight="normal" text-anchor="middle" fill="#555555">/v1/chat/completions</text>
<line x1="222" y1="115" x2="268" y2="115" stroke="#555555" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="270" y="60" width="660" height="110" rx="8" fill="#fff8e8" stroke="#c9a227" stroke-width="1.5"/>
<text x="290" y="86" font-size="15" font-weight="bold" text-anchor="start" fill="#222222">vLLM OpenAI server + scheduler</text>
<text x="290" y="112" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• Runs up to 8 sequences at once (--max-num-seqs 8); further requests wait in the queue</text>
<text x="290" y="134" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• Prefill in chunks of 16K tokens · DSpark speculative decoding, k=5 (~4 tokens per step)</text>
<text x="290" y="156" font-size="12.5" font-weight="normal" text-anchor="start" fill="#222222">• KV cache pool: fp8, ~1.07M tokens in total, shared by all running requests</text>
<line x1="380" y1="172" x2="240" y2="218" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
<line x1="820" y1="172" x2="720" y2="218" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
<text x="480.0" y="200" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">tensor parallel 2: each GPU holds half of every layer</text>
