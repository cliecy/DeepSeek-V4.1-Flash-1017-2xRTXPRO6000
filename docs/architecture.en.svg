<text x="318.77834525025537" y="284" font-size="12" font-weight="bold" text-anchor="start" fill="#ffffff">~20 GB*</text>
<text x="50" y="310" font-size="11.5" font-weight="normal" text-anchor="start" fill="#555555">VRAM (nvidia-smi): 89.9 GB used idle, 95.4 GB peak at ~1M context</text>
